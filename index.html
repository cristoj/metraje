<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulador de metrología</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="hazard" aria-hidden="true"></div>

  <header class="topbar">
    <h1>Metrología <small>Simulador de taller</small></h1>
    <nav id="tool-nav" aria-label="Herramientas de medida">
      <a href="#caliper" data-tool="caliper"><span class="idx">01</span>Calibre</a>
      <a href="#micrometer" data-tool="micrometer"><span class="idx">02</span>Micrómetro</a>
      <a href="#dial" data-tool="dial"><span class="idx">03</span>Reloj comparador</a>
    </nav>
  </header>

  <main id="stage"></main>

  <template id="tool-template">
    <section class="panel" hidden>
      <h2 class="sr-only" data-title></h2>

      <figure class="plate">
        <button type="button" class="toggle-btn" data-action="toggle" role="switch" aria-checked="true" hidden>
          <span class="toggle-label"></span>
          <span class="toggle-track" aria-hidden="true"><span class="toggle-knob"></span></span>
        </button>
        <div class="plate-tools">
          <ul class="specs">
            <li><span>Resolución</span><strong data-resolution></strong></li>
            <li><span>Rango</span><strong data-range></strong></li>
          </ul>
          <button type="button" class="help-btn" data-action="help" aria-label="Ayuda: cómo leer este instrumento" title="Ayuda">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 9.3a3 3 0 1 1 4.6 2.5c-1 .6-1.6 1.1-1.6 2.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.7" r="1.3" fill="currentColor"/></svg>
          </button>
        </div>
        <div class="figure-box" data-figure></div>
        <div class="zoom-group" role="group" aria-label="Zoom">
          <button type="button" data-action="zoom-out" aria-label="Alejar" title="Alejar">−</button>
          <button type="button" class="zoom-level" data-action="zoom-reset" aria-label="Restablecer zoom" title="Restablecer zoom">100%</button>
          <button type="button" data-action="zoom-in" aria-label="Acercar" title="Acercar">+</button>
        </div>
      </figure>

      <div class="dock">
        <form class="controls" novalidate>
          <label class="field">
            <span class="field-label">Medida leída</span>
            <span class="input-wrap">
              <input name="answer" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="0,00">
              <em>mm</em>
            </span>
          </label>
          <div class="actions">
            <button type="submit" class="btn btn-primary">Responder</button>
            <button type="button" class="btn btn-secondary" data-action="reveal">Ver respuesta</button>
            <button type="button" class="btn btn-ghost" data-action="next">Otra medida</button>
          </div>
        </form>

        <div class="results">
          <div class="feedback" data-feedback aria-live="polite"></div>
          <div class="answer" data-answer hidden></div>
        </div>
      </div>
    </section>
  </template>

  <dialog id="help-dialog" aria-labelledby="help-title">
    <form method="dialog" class="help-card">
      <header class="help-head">
        <h2 id="help-title"></h2>
        <button class="help-close" aria-label="Cerrar ayuda">×</button>
      </header>
      <div class="help-body" id="help-body"></div>
      <footer class="help-foot"><button class="btn btn-primary">Entendido</button></footer>
    </form>
  </dialog>

  <script src="js/measure.js"></script>
  <script src="js/zoom.js"></script>
  <script src="js/svg-kit.js"></script>
  <script src="js/caliper.js"></script>
  <script src="js/micrometer.js"></script>
  <script src="js/dial.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
